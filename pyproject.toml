[project]
name = "stemify-ml"
version = "0.1.0"
description = "Bass tablature transcription: audio in, tab out."
readme = "README.md"
# Pinned to match the SageMaker PyTorch training DLC (Python 3.12), so the
# interpreter that resolves deps and runs training is identical locally and in
# the container. See docs/datasets.md and the .python-version file.
requires-python = ">=3.12,<3.13"
dependencies = [
    "boto3>=1.43.50",
    "demucs>=4.0.1",
    "librosa>=0.11.0",
    "mir-eval>=0.8.2",
    "numpy>=2.4.6",
    "pesto-pitch>=2.0.1",
    "pretty-midi>=0.2.11",
    "sagemaker>=3.16.0",
    "soundfile>=0.14.0",
    "torch>=2.13.0",
    "torchaudio>=2.11.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/stemify"]
