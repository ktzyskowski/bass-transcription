[project]
name = "stemify-ml"
version = "0.1.0"
description = "Bass tablature transcription: audio in, tab out."
readme = "README.md"
# Pinned to match the SageMaker PyTorch training DLC (Python 3.12), so the
# interpreter that resolves deps and runs training is identical locally and in
# the container. See docs/datasets.md and the .python-version file.
requires-python = ">=3.12,<3.13"
dependencies = [
    "boto3>=1.43.50",
    "demucs>=4.0.1",
    "librosa>=0.11.0",
    "mir-eval>=0.8.2",
    "numpy>=2.4.6",
    "pesto-pitch>=2.0.1",
    "pretty-midi>=0.2.11",
    "sagemaker>=3.16.0",
    "soundfile>=0.14.0",
    "torch>=2.13.0",
    "torchaudio>=2.11.0",
]

# The two entry points, declared rather than left to be discovered. Both modules stay
# in the package -- they are not CLI wrappers (`train.py` is ~460 lines of which
# `main()` is the last fifth, and eight callers import from `evaluation.cli`), so
# moving them to `scripts/` would put library code somewhere unimportable, untestable
# and outside mypy's `files` scope. A console entry point gives the visibility without
# any of that.
[project.scripts]
stemify-train = "stemify.training.train:main"
stemify-eval = "stemify.evaluation.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/stemify"]

[dependency-groups]
dev = ["pytest>=8", "mlflow>=2", "mypy>=1.14"]

[tool.mypy]
python_version = "3.12"
files = ["src/stemify"]
strict = true
# librosa, demucs, mir_eval, pretty_midi and mlflow ship no stubs. Silencing the
# import errors is not the same as silencing errors *about* them: calls into these
# return Any, which `strict` still flags at the boundary where an Any is returned or
# assigned into a typed name -- which is where a wrong assumption about a third party
# actually bites.
ignore_missing_imports = true
# Tests are deliberately out of scope for now. They are dense with fixtures and
# duck-typed stand-ins whose whole purpose is to be structurally minimal, so checking
# them would add noise without adding safety. Revisit once src is clean.

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
