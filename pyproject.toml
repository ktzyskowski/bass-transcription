[project]
name = "stemify-ml"
version = "0.1.0"
description = "Bass tablature transcription: audio in, tab out."
readme = "README.md"
# Pinned to match the SageMaker PyTorch training DLC (Python 3.12), so the
# interpreter that resolves deps and runs training is identical locally and in
# the container. See docs/datasets.md and the .python-version file.
requires-python = ">=3.12,<3.13"
dependencies = [
    "boto3>=1.43.50",
    "demucs>=4.0.1",
    "librosa>=0.11.0",
    "mir-eval>=0.8.2",
    "numpy>=2.4.6",
    "pesto-pitch>=2.0.1",
    "pretty-midi>=0.2.11",
    "sagemaker>=3.16.0",
    "soundfile>=0.14.0",
    "torch>=2.13.0",
    "torchaudio>=2.11.0",
]

# The two entry points, declared rather than left to be discovered. Both modules stay
# in the package -- they are not CLI wrappers (`train.py` is ~460 lines of which
# `main()` is the last fifth, and eight callers import from `evaluation.cli`), so
# moving them to `scripts/` would put library code somewhere unimportable, untestable
# and outside mypy's `files` scope. A console entry point gives the visibility without
# any of that.
[project.scripts]
stemify-train = "stemify.training.cli:main"
stemify-eval = "stemify.evaluation.cli:main"
stemify-transcribe = "stemify.serving.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/stemify"]

[dependency-groups]
dev = [
    "pytest>=8",
 "mlflow>=2",
 "mypy>=1.14",
 "ruff>=0.9",
]

[tool.mypy]
python_version = "3.12"
files = ["src/stemify"]
strict = true
# librosa, demucs, mir_eval, pretty_midi and mlflow ship no stubs. Silencing the
# import errors is not the same as silencing errors *about* them: calls into these
# return Any, which `strict` still flags at the boundary where an Any is returned or
# assigned into a typed name -- which is where a wrong assumption about a third party
# actually bites.
ignore_missing_imports = true
# Tests are deliberately out of scope for now. They are dense with fixtures and
# duck-typed stand-ins whose whole purpose is to be structurally minimal, so checking
# them would add noise without adding safety. Revisit once src is clean.

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
# Same scope as mypy's `files`, plus the places mypy deliberately skips. Tests and
# scripts are out of mypy's reach for good reasons (duck-typed fixtures, one-off
# probes) -- but an unused import is an unused import wherever it sits, and those two
# directories accumulate them fastest.
src = ["src"]
include = ["src/**/*.py", "tests/**/*.py", "scripts/**/*.py"]
# The codebase's settled width, measured rather than chosen: p99 is 88 in both src and
# tests. Recorded so a formatter agrees with it, but E501 is deliberately *not*
# selected -- the convention already holds, and the ~120 lines past it are long URLs
# and docstring table rows where breaking hurts.
line-length = 88

[tool.ruff.lint]
# **Defects, not style.** This is a complement to mypy --strict, which sees a field
# that cannot exist but never a name that is never read. Rules that would relitigate
# formatting, import order or naming are left off on purpose: the codebase has a
# settled voice, and a linter arguing with it produces a 200-line diff that catches
# nothing and teaches people to skip the gate.
#
#   F  pyflakes -- unused imports and variables, undefined names, broken f-strings
#   B  bugbear  -- mutable defaults, loop-variable capture, and `zip` without
#                  `strict=`, which is a live bug class here: a length mismatch
#                  between a track's channels silently pairs track i's audio with
#                  track j's labels, loss still falling
#   W  pycodestyle warnings -- whitespace and EOF hygiene only, no line length
select = ["F", "B", "W"]

[tool.ruff.lint.per-file-ignores]
# A package `__init__` exists to re-export; every name in it is "unused" by definition.
"**/__init__.py" = ["F401"]
